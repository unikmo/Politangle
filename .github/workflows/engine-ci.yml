name: Politangle Engine CI

on:
  push:
    branches:
      - main
      - engine/v1
      - school/v1
      - school/age-bands-v2
      - countries/61-80
  pull_request:
    branches:
      - main
      - staging
      - engine/v1

jobs:
  verify-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run engine tests
        run: npm run verify:engine

      - name: Compile Next.js without environment-dependent prebuild
        run: npx next build

      - name: Run built-app release QA
        run: |
          npm start -- -H 127.0.0.1 -p 3000 > /tmp/politangle-next.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          node -e "const u='http://127.0.0.1:3000';let n=0;(async()=>{while(n++<60){try{const r=await fetch(u);if(r.ok)process.exit(0)}catch{};await new Promise(r=>setTimeout(r,500))}process.exit(1)})()"
          POLITANGLE_BASE_URL=http://127.0.0.1:3000 npm run verify:release


      - name: Package source for Netlify release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: tar --exclude=.git --exclude=node_modules --exclude=.next -czf "$RUNNER_TEMP/politangle-release-source.tgz" .

      - name: Upload Netlify release source
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: politangle-release-source-${{ github.sha }}
          path: ${{ runner.temp }}/politangle-release-source.tgz
          retention-days: 3
