name: Politangle Engine CI

on:
  push:
    branches:
      - main
      - engine/v1
      - school/v1
      - school/age-bands-v2
  pull_request:
    branches:
      - main
      - staging
      - engine/v1

jobs:
  verify-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run engine tests
        run: npm run verify:engine

      - name: Compile Next.js without environment-dependent prebuild
        run: npx next build
