name: Politangle production editorial acceptance
on:
  pull_request:
    branches: [main]
    paths: [scripts/verify-live-editorial.mjs, .github/workflows/live-editorial.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify live five-language editorial URLs
        run: node scripts/verify-live-editorial.mjs
