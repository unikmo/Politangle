name: Politangle Editorial QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify editorial integrity, privacy and neutral positioning
        run: node scripts/verify-editorial.mjs
      - name: Verify question and scoring engine
        run: npm run verify:engine
      - name: Verify TypeScript
        run: npx tsc --noEmit
