name: Independent desktop browser E2E
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx next build
      - name: Install browsers
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Independent desktop end-to-end journeys
        run: |
          npm start -- -H 127.0.0.1 -p 3000 > /tmp/politangle-desktop.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          node -e "const u='http://127.0.0.1:3000';let n=0;(async()=>{while(n++<100){try{const r=await fetch(u);if(r.ok)process.exit(0)}catch{};await new Promise(r=>setTimeout(r,500))}process.exit(1)})()"
          POLITANGLE_BASE_URL=http://127.0.0.1:3000 node scripts/independent-desktop-e2e.mjs
      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-server-log
          path: /tmp/politangle-desktop.log
          if-no-files-found: ignore
