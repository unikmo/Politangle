name: Politangle production live confirmation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: politangle-live-${{ github.ref }}
  cancel-in-progress: true
jobs:
  confirm-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Verify production commit served on politangle.org
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          POLITANGLE_LIVE_ORIGIN: https://politangle.org
          LIVE_VERIFY_ATTEMPTS: '30'
          LIVE_VERIFY_DELAY_MS: '20000'
        run: node scripts/verify-live-release.mjs
